<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Databases / Dashboards sidebar tree</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body data-theme="dark">
  <!-- `#root` on purpose: styles.css gives it the full-height flex column the
       real app mounts into, so `.main-row`/`.sidebar` size the same way here. -->
  <div id="root"></div>
  <script type="importmap">
    { "imports": {
      "@preact/signals-core": "/node_modules/@preact/signals-core/dist/signals-core.mjs",
      "marked": "/node_modules/marked/lib/marked.esm.js",
      "@codemirror/state": "/node_modules/@codemirror/state/dist/index.js",
      "@codemirror/view": "/node_modules/@codemirror/view/dist/index.js",
      "@codemirror/commands": "/node_modules/@codemirror/commands/dist/index.js",
      "@codemirror/lang-json": "/node_modules/@codemirror/lang-json/dist/index.js",
      "@codemirror/language": "/node_modules/@codemirror/language/dist/index.js",
      "@codemirror/lang-sql": "/node_modules/@codemirror/lang-sql/dist/index.js",
      "@codemirror/lang-xml": "/node_modules/@codemirror/lang-xml/dist/index.js",
      "@codemirror/autocomplete": "/node_modules/@codemirror/autocomplete/dist/index.js",
      "@codemirror/search": "/node_modules/@codemirror/search/dist/index.js",
      "@lezer/common": "/node_modules/@lezer/common/dist/index.js",
      "@lezer/highlight": "/node_modules/@lezer/highlight/dist/index.js",
      "@lezer/lr": "/node_modules/@lezer/lr/dist/index.js",
      "@lezer/json": "/node_modules/@lezer/json/dist/index.js",
      "@lezer/xml": "/node_modules/@lezer/xml/dist/index.js",
      "style-mod": "/node_modules/style-mod/src/style-mod.js",
      "w3c-keyname": "/node_modules/w3c-keyname/index.js",
      "crelt": "/node_modules/crelt/index.js",
      "@marijn/find-cluster-break": "/node_modules/@marijn/find-cluster-break/src/index.js"
    } }
  </script>
  <script type="module">
    // #426: mounts the REAL application shell, so the two upper-role hosts, the
    // role tab row and the Dashboard tree are laid out by the shipped CSS. Only
    // the workbench column is left out (this fixture never needs the editor), so
    // `mountAppShell` is called directly rather than through `app.renderApp()`.
    import { createApp } from '/src/ui/app.js';
    import { mountAppShell } from '/src/ui/app-shell.js';
    import { startDrag } from '/src/ui/splitters.js';
    import { createAuthenticatedExecutionScope } from '/src/application/authenticated-execution-scope.js';
    import { showInInspector, releaseInspector } from '/src/ui/inspector-host.js';

    const query = (id, name, sql = 'SELECT 1', over = {}) => ({
      id, sql, specVersion: 1,
      spec: { name, panel: { cfg: { type: 'bar', x: 0, y: [1] } }, ...over },
    });
    const dash = (id, title, over = {}) => ({
      documentVersion: 2, id, title, revision: 1,
      layout: { type: 'flow', version: 1, preset: 'report', items: {} },
      tiles: [], ...over,
    });
    const seed = {
      storageVersion: 5, id: 'workspace', key: 'workspace', name: 'Workspace',
      queries: [
        // #447: the panel query's own `{name:Type}` placeholders ARE the
        // Dashboard's variables — `zone` and `region`. Nothing declares them.
        query('q-rev', 'Revenue', 'SELECT 1 AS v, {zone:String} AS z, {region:String} AS r'),
        query('q-cost', 'Cost'),
        // #428: a LIBRARY query — referenced by no tile, so it is the only entry
        // the lower pane renders and the only draggable assignment source. Both
        // queries above are tiled, which left this fixture's Library empty.
        query('q-lib', 'Countries', "SELECT 'eu' AS v, 'Europe' AS l"),
      ],
      dashboards: [
        dash('sales', 'Sales revenue', {
          // `zone` carries Dashboard-local option SQL, so it is a CONFIGURED
          // variable (and its SQL is searchable); `region` is a direct input.
          variableConfigs: { zone: { sql: "SELECT 'eu', 'Europe'" } },
          tiles: [{ id: 't-rev', queryId: 'q-rev' }, { id: 't-cost', queryId: 'q-cost' }],
        }),
        dash('ops', 'Ops latency'),
        // A deliberately long title, to prove the row ellipsizes instead of
        // widening the sidebar (happy-dom cannot see this at all).
        dash('long', 'A very long dashboard title that must ellipsize rather than widen the sidebar'),
      ],
    };

    const root = document.querySelector('#root');
    const app = createApp({ root, broadcastChannel: () => null });
    // #524: expanding a schema row enters authenticated work. The fixture
    // mounts the shell directly (without normal sign-in bootstrap), so keep an
    // explicit open test epoch for those otherwise stubbed requests.
    const scope = createAuthenticatedExecutionScope({ epoch: 1, cancelRemote: () => {} });
    app.executionScope = () => scope;
    app.requireAuthenticatedExecution = () => scope;
    app.conn.ensureFreshToken = async () => true;
    app.conn.chCtx.onSignedOut = () => {};
    // The schema catalog is stubbed: this fixture is about the ROLE SWITCH, and a
    // real schema load would need a server.
    app.catalog.loadSchema = async () => {
      app.state.schema.value = [
        { db: 'default', comment: '', tables: [{ name: 'events', total_rows: 10, comment: '', columns: null }] },
        { db: 'system', comment: '', tables: [] },
      ];
    };
    // The expansion assertion is about preserving the row, not fetching its
    // columns. Keep that lazy request within the fixture's no-network seam.
    app.catalog.loadColumns = async () => {};
    app.catalog.loadReference = async () => {};
    // Expanding the database also offers the production schema-graph action;
    // this tree-only fixture neither mounts nor asserts that graph.
    app.actions.showSchemaGraph = () => {};

    // Record navigation instead of performing it: this fixture verifies the TREE,
    // not the Dashboard renderer (which has its own fixtures).
    window.__opened = [];
    window.__renders = 0;
    app.openDashboard = (request) => { window.__opened.push({ kind: 'dashboard', ...request }); };
    app.openSavedQuery = (queryId) => { window.__opened.push({ kind: 'query', queryId }); };
    app.renderCurrentSurface = () => { window.__renders += 1; };

    const loaded = await app.workspace.loadById(seed.id);
    let workspace = loaded.status === 'ok' ? loaded.workspace : null;
    if (!sessionStorage.getItem('tree-seeded')) {
      await app.workspace.delete(seed.id);
      const committed = await app.workspace.create(seed);
      if (!committed.ok) throw new Error(committed.diagnostics[0]?.message || 'seed failed');
      workspace = committed.workspace;
      sessionStorage.setItem('tree-seeded', '1');
    }
    if (!workspace) throw new Error('seeded workspace missing');

    mountAppShell({
      app,
      root,
      document,
      state: app.state,
      catalog: app.catalog,
      prefs: app.prefs,
      matchMedia: (q) => window.matchMedia(q),
      updateBanner: () => {},
      startDrag,
    });
    app.applyCommittedWorkspace(workspace);

    // #586 AC2 real-browser layout gate (sidebar-tabs-narrow.spec.js's own
    // header comment explains why this fixture, not a happy-dom unit test,
    // is the only place that can prove CSS layout claims): this fixture
    // mounts the real shell — `.main-row`/`.query-host`/`.inspector-host`/
    // `.inspector-resize` are ALL genuine, styled DOM here — but never wires
    // a real docked surface (no workbench/editor/results mounted; see this
    // file's own header comment on why). Driving `inspector-host.ts`'s own
    // dock primitive directly is the same shared mechanism EVERY docked
    // surface (Cell, Rows, Reference) is built on (#586) — the geometry
    // this gate checks is exactly and only that primitive's, not any one
    // surface's content.
    window.__openInspector = () => {
      const content = document.createElement('div');
      content.className = 'test-inspector-content';
      content.textContent = 'inspector content';
      return showInInspector(app, content, () => releaseInspector(app));
    };
    window.__closeInspector = () => releaseInspector(app);
    // #586 findings 2a/2b real-browser gate: let a spec set the persisted
    // preference (and, for the sidebar case, the tracked width app-shell.ts's
    // dock-aware clamp reads) directly, rather than driving a real drag.
    window.__setRightInspectorPx = (px) => { app.state.rightInspectorPx = px; };
    window.__setSidebarPx = (px) => {
      app.state.sidebarPx = px;
      document.querySelector('.sidebar').style.width = px + 'px';
    };

    /** Drive the selected Dashboard/member the way the real controller would, so
     *  current-resource styling can be verified against real CSS. */
    // #457: a variable row opens a main-editor TAB now. This fixture deliberately
    // omits the workbench (see the header comment), so there is no tab strip to
    // read — the tab MODEL is what it can prove, and the full click → tab → edit →
    // Save loop lives in `variable-tab.html`, which mounts the whole app.
    window.__variableTabs = () => app.state.tabs.value
      .filter((tab) => tab.doc?.kind === 'dashboard-variable')
      .map((tab) => ({ name: tab.name, sql: tab.sqlDraft, ...tab.doc }));

    window.__select = (dashboardId, member = null) => {
      app.mainSurface = dashboardId === null
        ? { kind: 'query' }
        : { kind: 'dashboard', dashboardId, mode: 'edit', currentMember: member, pendingFocus: null };
      app.invalidateDashboardTree();
    };
    // #428: read COMMITTED truth back out of the store, so an assignment test
    // asserts what was persisted rather than what the projection happens to show.
    window.__committed = async () => {
      const loaded = await app.workspace.loadById(seed.id);
      return loaded.status === 'ok' ? loaded.workspace : null;
    };
    window.__ready = true;
  </script>
</body>
</html>
