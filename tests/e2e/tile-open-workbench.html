<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Per-tile Open in Workbench (#471)</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body data-theme="dark">
  <!-- `#root` on purpose: styles.css scopes the full-height flex chain to it. -->
  <div id="root"></div>
  <script type="importmap">
    { "imports": {
      "@preact/signals-core": "/node_modules/@preact/signals-core/dist/signals-core.mjs",
      "marked": "/node_modules/marked/lib/marked.esm.js",
      "@codemirror/state": "/node_modules/@codemirror/state/dist/index.js",
      "@codemirror/view": "/node_modules/@codemirror/view/dist/index.js",
      "@codemirror/commands": "/node_modules/@codemirror/commands/dist/index.js",
      "@codemirror/lang-json": "/node_modules/@codemirror/lang-json/dist/index.js",
      "@codemirror/language": "/node_modules/@codemirror/language/dist/index.js",
      "@codemirror/lang-sql": "/node_modules/@codemirror/lang-sql/dist/index.js",
      "@codemirror/lang-xml": "/node_modules/@codemirror/lang-xml/dist/index.js",
      "@codemirror/autocomplete": "/node_modules/@codemirror/autocomplete/dist/index.js",
      "@codemirror/search": "/node_modules/@codemirror/search/dist/index.js",
      "@lezer/common": "/node_modules/@lezer/common/dist/index.js",
      "@lezer/highlight": "/node_modules/@lezer/highlight/dist/index.js",
      "@lezer/lr": "/node_modules/@lezer/lr/dist/index.js",
      "@lezer/json": "/node_modules/@lezer/json/dist/index.js",
      "@lezer/xml": "/node_modules/@lezer/xml/dist/index.js",
      "style-mod": "/node_modules/style-mod/src/style-mod.js",
      "w3c-keyname": "/node_modules/w3c-keyname/index.js",
      "crelt": "/node_modules/crelt/index.js",
      "@marijn/find-cluster-break": "/node_modules/@marijn/find-cluster-break/src/index.js"
    } }
  </script>
  <script type="module">
    // #471: the WHOLE application, like variable-tab.html — the Dashboards tree, a
    // real Dashboard render, AND the workbench column with a real CodeMirror. That
    // is the only way to observe the full claim end to end: a tile action opens the
    // tile's OWN document in the shipped tab strip, re-opening selects that tab,
    // and two Dashboard copies sharing a NAME still get two tabs.
    //
    // It also carries what happy-dom structurally cannot: the hover/focus reveal of
    // a subtle action, a KPI tile whose head is a pointer-transparent overlay, the
    // real drag engine (a press on the action must not move the tile), and the
    // mobile bottom nav that is now a Dashboard's route back.
    import { createApp } from '/src/ui/app.js';
    import { createCodeMirrorEditor } from '/src/editor/codemirror-adapter.js';
    import { createSpecEditor } from '/src/editor/spec-editor.js';
    import { createCodeViewer } from '/src/editor/code-viewer.js';

    // `table` rather than a chart panel: the Chart.js seam is deliberately NOT
    // injected here (this fixture is about a tile's chrome, not its rendering), and
    // a chart tile would throw `ChartCtor is not a constructor` mid-render.
    const query = (id, name, sql, cfg = { type: 'table' }) => ({
      id, sql, specVersion: 1, spec: { name, panel: { cfg } },
    });
    // Both Dashboards own a copy called `Live KPIs`. That is the point: identity is
    // the copy's id (#427), never the displayed name, so these are two documents
    // and must open two tabs.
    const seed = {
      storageVersion: 5, id: 'workspace', key: 'workspace', name: 'Workspace',
      queries: [
        query('q-sales', 'Live KPIs', 'SELECT 1 AS v'),
        query('q-ops', 'Live KPIs', 'SELECT 2 AS v'),
        // A KPI tile. In the grid engine it is a frameless CARD whose head is a
        // pointer-transparent overlay — the hardest case for this action. (In FLOW
        // layout the same tile renders into a `.dash-kpi-member` band host that has no
        // chrome and no box, where the action is anchored inside the card instead;
        // `dashboard.test.ts` covers that shape.)
        query('q-kpi', 'Revenue KPI', 'SELECT 42 AS value', { type: 'kpi' }),
        // A genuinely queryless tile — it must expose NO action rather than opening
        // an unrelated document.
        query('q-text', 'Runbook', '', { type: 'text', content: '# Runbook' }),
      ],
      dashboards: [
        // `ops` is deliberately the collection's FIRST entry: the fallback this
        // feature replaces resolved the first Dashboard, so a test that LEAVES `sales`
        // can only tell the two apart when `sales` is not also the fallback's answer.
        {
          documentVersion: 2, id: 'ops', title: 'Ops', revision: 1,
          layout: { type: 'flow', version: 1, preset: 'report', items: {} },
          tiles: [{ id: 't-ops', queryId: 'q-ops' }],
        },
        {
          documentVersion: 2, id: 'sales', title: 'Sales', revision: 1,
          // grafana-grid, the DEFAULT engine (#321): every tile — KPI included —
          // renders as a card with a real head, which is where the action lives. A
          // KPI card's head is a pointer-transparent overlay that View mode used to
          // keep permanently hidden, and that is the case worth driving in a real
          // browser. (`ops` above stays on flow, so the same-name test covers that
          // engine too.)
          layout: {
            type: 'grafana-grid', version: 1,
            items: { 't-kpi': { span: 4, height: 2 }, 't-sales': { span: 8 }, 't-text': { span: 12 } },
            // grafana-grid@1 is only valid with a flow@1 fallback (the aggregate
            // rejects the document otherwise).
            fallback: { type: 'flow', version: 1, preset: 'report', items: {} },
          },
          // The KPI tile comes FIRST so it sits clear of the sticky Dashboard
          // toolbar — a spec that has to scroll it into view ends up clicking the
          // toolbar instead of the tile.
          tiles: [
            { id: 't-kpi', queryId: 'q-kpi' },
            { id: 't-sales', queryId: 'q-sales' },
            { id: 't-text', queryId: 'q-text' },
          ],
        },
      ],
    };

    const root = document.querySelector('#root');
    const app = createApp({
      root,
      broadcastChannel: () => null,
      Editor: createCodeMirrorEditor,
      SpecEditor: (a) => createSpecEditor(a),
      CodeViewer: createCodeViewer,
    });
    app.conn.ensureFreshToken = async () => true;
    app.conn.chCtx.onSignedOut = () => {};
    app.catalog.loadSchema = async () => { app.state.schema.value = []; };
    app.catalog.loadReference = async () => {};
    // Tiles must reach 'ready' for the KPI band to render its member content — a
    // real run would need a server.
    app.exec.executeRead = async (result) => {
      result.columns = [{ name: 'value', type: 'UInt8' }];
      result.rows = [[42]];
      result.progress = { rows: 1, bytes: 1 };
      result.error = null;
      return result;
    };

    // Reseeded on every load: these specs open tabs and navigate for real.
    await app.workspace.delete(seed.id);
    const committed = await app.workspace.create(seed);
    if (!committed.ok) throw new Error(committed.diagnostics[0]?.message || 'seed failed');
    const workspace = committed.workspace;

    app.applyCommittedWorkspace(workspace);
    app.renderApp();
    app.applyCommittedWorkspace(workspace);

    /** Every open tab, as the model sees it — `savedId` is the document identity
     *  the whole feature turns on. */
    window.__tabs = () => app.state.tabs.value.map((tab) => ({
      name: tab.name, savedId: tab.savedId, docKind: tab.doc?.kind ?? null,
      active: tab.id === app.state.activeTabId.value,
    }));
    window.__surface = () => app.mainSurface.kind;
    /** Committed truth for every query, so a Save can be checked against the
     *  Dashboard's OWN copy and against the same-named copy it must not touch. */
    window.__queries = async () => {
      const read = await app.workspace.loadById(seed.id);
      return read.status === 'ok'
        ? read.workspace.queries.map((query) => ({ id: query.id, name: query.spec.name, sql: query.sql }))
        : null;
    };
    window.__app = app;
    window.__ready = true;
  </script>
</body>
</html>
