<script type="importmap">
{
  "imports": {
    "@clickhouse/client-web": "/__clickhouse-client-web.mjs"
  }
}
</script>
</head>
<body>
<script type="module">
  import { runScenario } from '/tests/spike/clickhouse-client/browser-harness.js';
  window.__spikeRun = runScenario;
  window.__spikeReady = true;
</script>
</body>
</html>
