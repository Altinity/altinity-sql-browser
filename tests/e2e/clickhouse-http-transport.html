<body>
  <!-- #630 Phase 1 — the real production transport (`/src/net/clickhouse-http-transport.js`,
       served as raw ESM by build/e2e-serve.mjs, type-stripped from the .ts
       source with no bundling) driven against a real cross-origin fault
       server, in a real browser. Every helper below is orchestration only —
       it counts calls, captures the exact url/init the injected fetch was
       given, and retains the native Response — it never re-derives chUrl,
       request construction, SQL handling, signal handling, or body
       consumption, all of which stay inside the imported production module.
       Native `Response` objects cannot cross Playwright's page.evaluate()
       serialization boundary, so every scenario below does its own identity
       assertion INSIDE the page realm and returns only plain, serializable
       results (booleans/numbers/strings) to the Node-side spec.

       #630 Phase 2 — the transport module now imports the bare
       `@altinity/clickhouse-http` package specifier. build/e2e-serve.mjs is a
       raw file server, not a bundler/resolver, so this import map resolves
       that ONE bare specifier to the workspace source directly.

       #630 Phase 3 — Scenario 6 and Scenario 8 below no longer call
       `transport.streamLines()` (the transport adapter no longer has a
       stream member at all): they import the package's own `streamLines`
       directly, exercising the SAME real production call path
       `ch-client.ts`'s `runQuery` uses — no additional import-map entry is
       needed, since the specifier is already mapped above.

       #630 Phase 4 — Scenario 9 (new, additive) exercises the package's own
       `createClickHouseHttpClient(...).queryProgress()` convenience method
       directly against the same real cross-origin fault server and the same
       'post-header-abort-hold' fixture Scenario 6 already uses — proving the
       NEW Phase-4 API preserves the identical native post-header cancellation
       semantics (one real Fetch, the caller's own AbortSignal driving
       cancellation for the response's whole lifetime, no callbacks after
       rejection). Scenarios 1-8 are otherwise UNCHANGED: they still exercise
       the raw `createHttpTransport().send()` -> package `streamLines`
       composition directly, which was the ordinary SQL Browser production
       path through #630 Phase 5. Since Phase 6, the actual production path
       for `queryJson`/`runQuery`/`exportQuery` is the authenticated-path
       composition below (`authenticatedRequest()`/`authenticatedProgress()`
       -> package `request()`/response consumers) — `createHttpTransport`
       itself now remains live only as the frozen-lease `killQueryWithLease`
       bypass's compatibility route. Scenarios 1-8 stay as lower-layer
       package/transport regression coverage; they are not claimed to
       exercise the current ordinary production path.

       #630 Phase 6 — authenticated-path variants of the post-header
       cancellation scenarios (5-9), proving the SAME native
       Fetch/Response/cancellation semantics survive being driven through
       SQL Browser's own credential/epoch composition
       (`/src/net/authenticated-clickhouse-request.js`, raw ESM, same
       mixed-tree .ts->.js serving as every other `/src/**` import here) —
       not just the compatibility transport/package client with an
       already-resolved Authorization. Each `*Auth` scenario below builds one
       real-production-shaped `AuthenticatedRequestCtx` (`makeAuthCtx`) with
       synthetic test credentials, one deterministic epoch, `refresh()`
       disabled (returns `false`) except where a scenario needs a genuine
       401-then-retry, and captures `onTransportConnected`/
       `onTransportOffline`/`onSignedOut` calls — then passes each scenario's
       original `AbortController.signal` straight through, exactly like the
       raw scenarios above. Scenarios 1-4 stay raw/unauthenticated
       (pre-header timing — optional to duplicate through auth per the plan);
       only the post-header family (5-9) gets an authenticated variant. -->
  <script type="importmap">
    { "imports": {
      "@altinity/clickhouse-http": "/packages/clickhouse-http/src/index.js"
    } }
  </script>
  <script type="module">
    import { createHttpTransport } from '/src/net/clickhouse-http-transport.js';
    import { streamLines, createClickHouseHttpClient } from '@altinity/clickhouse-http';
    import { authenticatedRequest, authenticatedProgress } from '/src/net/authenticated-clickhouse-request.js';

    // A counting wrapper around the real, native `window.fetch` — the ONLY
    // thing under `deps.fetch()`. It never replaces/derives the signal,
    // never clones or wraps the Response, never consumes a body, never
    // retries, never normalizes a value: it delegates exactly once per call
    // and remembers what it was given / what it got back.
    function makeWrapper() {
      const calls = [];
      let lastResponse = null;
      async function wrapped(url, init) {
        calls.push({
          url: String(url),
          method: init && init.method,
          body: init && init.body,
          authorization: init && init.headers && init.headers.Authorization,
          hasSignal: !!(init && init.signal),
        });
        const resp = await window.fetch(url, init);
        lastResponse = resp;
        return resp;
      }
      return {
        fn: wrapped,
        calls,
        get count() { return calls.length; },
        get lastResponse() { return lastResponse; },
      };
    }

    function makeTransport(baseUrl) {
      const wrapper = makeWrapper();
      const transport = createHttpTransport({ fetch: () => wrapper.fn, origin: () => baseUrl });
      return { transport, wrapper };
    }

    // #630 Phase 4 — same real, native `window.fetch` counting wrapper as
    // `makeTransport` above, but constructing the package's OWN
    // `createClickHouseHttpClient(...)` directly (not the SQL Browser
    // compatibility adapter) — Scenario 9 below exercises the new
    // `queryProgress()` convenience method through it.
    function makeClient(baseUrl) {
      const wrapper = makeWrapper();
      const client = createClickHouseHttpClient({ fetch: () => wrapper.fn, origin: () => baseUrl });
      return { client, wrapper };
    }

    // #630 Phase 6 — a real production-shaped `AuthenticatedRequestCtx`:
    // synthetic test credentials only (never real ones), one deterministic
    // epoch (`currentEpoch` always returns 1 — nothing in these cancellation
    // scenarios ever changes credential generation), `refresh()` disabled
    // (returns `false`) unless a scenario explicitly overrides it, and
    // `onSignedOut`/`onTransportConnected`/`onTransportOffline` captured as
    // plain call counters so a scenario can assert none fired after a
    // cancellation. Uses the SAME real, native `window.fetch` counting
    // wrapper as `makeTransport`/`makeClient` above — the only thing under
    // `ctx.fetch`.
    function makeAuthCtx(baseUrl, overrides = {}) {
      const wrapper = makeWrapper();
      const onSignedOutCalls = [];
      const onTransportConnectedCalls = [];
      const onTransportOfflineCalls = [];
      const ctx = {
        fetch: wrapper.fn,
        origin: baseUrl,
        getToken: async () => 'auth-e2e-test-token',
        refresh: async () => false,
        onSignedOut: (detail, expectedEpoch) => { onSignedOutCalls.push({ detail, expectedEpoch }); },
        currentEpoch: () => 1,
        onTransportConnected: () => { onTransportConnectedCalls.push(true); },
        onTransportOffline: (error) => { onTransportOfflineCalls.push(error); },
        ...overrides,
      };
      return { ctx, wrapper, onSignedOutCalls, onTransportConnectedCalls, onTransportOfflineCalls };
    }

    async function nameOf(promise) {
      try {
        await promise;
        return null;
      } catch (e) {
        return e && e.name;
      }
    }

    // ── Scenario 1 — request and Response fidelity (bullets 1, 2, 4, 5, 7) ──
    // Uses the 'ordinary-query' fixture (any 2xx works; content is irrelevant
    // to this scenario's assertions) and an independently authored
    // pathological SQL literal — never derived from chUrl/the production
    // helper under test.
    const SCENARIO1_SQL = '  -- leading comment\n\tSELECT \'héllo\', 1 -- trailing comment\nFORMAT CSV;  \n';
    const SCENARIO1_AUTHORIZATION = 'Bearer test-token-abc123';
    window.__scenario1 = async function (baseUrl, queryId) {
      const { transport, wrapper } = makeTransport(baseUrl);
      const resp = await transport.send({
        sql: SCENARIO1_SQL,
        defaultFormat: 'JSONCompact',
        settings: { wait_end_of_query: 0, empty_setting: '' }, // numeric zero + empty-string setting
        params: {
          query_id: queryId,
          space_val: 'a b', // spaces
          reserved_val: 'a&b=c?d#e', // reserved characters
          empty_param: '', // empty-string parameter
        },
        authorization: SCENARIO1_AUTHORIZATION,
      });
      const identity = resp === wrapper.lastResponse;
      const bodyUsedBeforeConsume = resp.bodyUsed;
      await resp.text(); // consume only AFTER the bodyUsed snapshot above
      return {
        identity,
        count: wrapper.count,
        url: wrapper.calls[0].url,
        sqlMatches: wrapper.calls[0].body === SCENARIO1_SQL,
        authorization: wrapper.calls[0].authorization,
        bodyUsedBeforeConsume,
        status: resp.status,
      };
    };

    // ── Scenario 2 — non-2xx untouched (bullet 3) ───────────────────────────
    window.__scenario2 = async function (baseUrl, queryId) {
      const { transport, wrapper } = makeTransport(baseUrl);
      const resp = await transport.send({
        sql: 'SELECT 1',
        defaultFormat: 'JSON',
        params: { query_id: queryId },
        authorization: 'Bearer tok',
      });
      const identity = resp === wrapper.lastResponse;
      const bodyUsedBeforeConsume = resp.bodyUsed;
      const text = await resp.text();
      return { identity, count: wrapper.count, status: resp.status, bodyUsedBeforeConsume, text };
    };

    // ── Scenario 3 — pre-aborted request (bullet 9) ─────────────────────────
    window.__scenario3 = async function (baseUrl, queryId) {
      const { transport, wrapper } = makeTransport(baseUrl);
      const controller = new AbortController();
      controller.abort();
      const rejectedName = await nameOf(transport.send({
        sql: 'SELECT 1',
        defaultFormat: 'JSON',
        params: { query_id: queryId },
        authorization: 'Bearer tok',
        signal: controller.signal,
      }));
      // One task turn for any deferred network activity to surface before
      // the Node side inspects the fault server's request log.
      await new Promise((r) => setTimeout(r, 50));
      return { count: wrapper.count, rejectedName };
    };

    // ── Scenario 4 — abort while awaiting headers (bullet 10) ───────────────
    // Two-phase: the Node side must observe the fault server has already
    // logged the POST (real dispatch happened) before instructing the page
    // to abort — otherwise this couldn't distinguish "cancelled before
    // dispatch" from "cancelled while genuinely awaiting headers".
    window.__scenario4Start = function (baseUrl, queryId) {
      const { transport, wrapper } = makeTransport(baseUrl);
      const controller = new AbortController();
      const promise = transport.send({
        sql: 'SELECT 1',
        defaultFormat: 'JSON',
        params: { query_id: queryId },
        authorization: 'Bearer tok',
        signal: controller.signal,
      });
      window.__scenario4State = { wrapper, controller, promise };
      return true;
    };
    window.__scenario4AbortAndAwait = async function () {
      const { wrapper, controller, promise } = window.__scenario4State;
      controller.abort();
      const rejectedName = await nameOf(promise);
      return { count: wrapper.count, rejectedName };
    };

    // ── Scenario 5 — native post-header body lifetime (bullet 11) ──────────
    // Two-phase: phase 1 settles send() and reads the immediate first chunk;
    // phase 2 starts a second, genuinely pending native reader.read() (the
    // fixture holds the next chunk for POST_HEADER_ABORT_HOLD_MS) and THEN
    // aborts the original signal.
    window.__scenario5Start = async function (baseUrl, queryId) {
      const { transport, wrapper } = makeTransport(baseUrl);
      const controller = new AbortController();
      const resp = await transport.send({
        sql: 'SELECT 1',
        defaultFormat: 'JSON',
        params: { query_id: queryId },
        authorization: 'Bearer tok',
        signal: controller.signal,
      });
      const identity = resp === wrapper.lastResponse;
      const bodyUsedBeforeRead = resp.bodyUsed;
      const reader = resp.body.getReader();
      const first = await reader.read();
      const firstText = first.value ? new TextDecoder().decode(first.value) : null;
      window.__scenario5State = { controller, reader, resp };
      return { identity, bodyUsedBeforeRead, firstDone: first.done, firstText };
    };
    // `reader.read()` is issued BEFORE `controller.abort()` (both inside the
    // same synchronous turn of this one page.evaluate() call) so the pending
    // read is genuinely in flight — not merely "about to be issued" — at the
    // moment of cancellation.
    window.__scenario5AbortAndReadNext = async function () {
      const { controller, reader, resp } = window.__scenario5State;
      const pending = reader.read();
      controller.abort();
      const rejectedName = await nameOf(pending);
      return { rejectedName, sendResponseStatus: resp.status, sendResponseOk: resp.ok };
    };

    // ── Scenario 6 — no later package streamLines() callbacks after
    //    cancellation (bullet 12) — single call: the abort is scheduled from
    //    inside the first onChunk callback, then the scenario itself waits
    //    out the fixture's hold before returning, so the Node side never
    //    needs its own timing loop. Requests through the production
    //    `createHttpTransport().send()` adapter, then streams the resulting
    //    native `resp.body` through the package's own `streamLines` — the
    //    exact call path `ch-client.ts`'s `runQuery` uses in production
    //    since Phase 3. ───────────────────────────────────────────────────
    window.__scenario6 = async function (baseUrl, queryId, holdMs) {
      const { transport } = makeTransport(baseUrl);
      const controller = new AbortController();
      const resp = await transport.send({
        sql: 'SELECT 1',
        defaultFormat: 'JSON',
        params: { query_id: queryId },
        authorization: 'Bearer tok',
        signal: controller.signal,
      });
      const lines = [];
      let chunkCount = 0;
      let aborted = false;
      const streamPromise = streamLines(resp.body, {
        onLine: (l) => lines.push(l),
        onChunk: () => {
          chunkCount++;
          if (!aborted) {
            aborted = true;
            controller.abort();
          }
        },
      });
      const rejectedName = await nameOf(streamPromise);
      const linesAtRejection = lines.length;
      const chunksAtRejection = chunkCount;
      await new Promise((r) => setTimeout(r, holdMs + 1000)); // comfortably past the fixture's hold
      return {
        rejectedName,
        linesAtRejection,
        chunksAtRejection,
        linesAfterWait: lines.length,
        chunksAfterWait: chunkCount,
      };
    };

    // ── Scenario 7 — concurrent-request isolation (bullet 13) ──────────────
    // ONE shared transport instance for both A and B — a transport-global
    // cancellation-state bug would only be observable this way.
    window.__scenario7 = async function (baseUrl, queryIdA, queryIdB, holdMs) {
      const { transport } = makeTransport(baseUrl);
      const controllerA = new AbortController();
      const controllerB = new AbortController();
      const [respA, respB] = await Promise.all([
        transport.send({ sql: 'SELECT 1', defaultFormat: 'JSON', params: { query_id: queryIdA }, authorization: 'Bearer tok', signal: controllerA.signal }),
        transport.send({ sql: 'SELECT 1', defaultFormat: 'JSON', params: { query_id: queryIdB }, authorization: 'Bearer tok', signal: controllerB.signal }),
      ]);
      const readerA = respA.body.getReader();
      const readerB = respB.body.getReader();
      await readerA.read(); // immediate first chunk, both sides
      await readerB.read();
      const pendingA = readerA.read(); // now both genuinely pending on the fixture's hold
      const pendingB = readerB.read();
      controllerA.abort();
      const aRejectedName = await nameOf(pendingA);
      const bResult = await pendingB; // B must NOT be affected by A's abort
      const bFirstHeldText = bResult.value ? new TextDecoder().decode(bResult.value) : null;
      const bNext = await readerB.read();
      return { aRejectedName, bFirstHeldDone: bResult.done, bFirstHeldText, bCompletedCleanly: bNext.done };
    };

    // ── Scenario 8 — abort after full completion has no effect (bullet 14) ─
    //    Also uses the package's own `streamLines` (#630 Phase 3) — see
    //    Scenario 6's comment above.
    window.__scenario8 = async function (baseUrl, queryId) {
      const { transport } = makeTransport(baseUrl);
      const controller = new AbortController();
      const resp = await transport.send({
        sql: 'SELECT 1',
        defaultFormat: 'JSON',
        params: { query_id: queryId },
        authorization: 'Bearer tok',
        signal: controller.signal,
      });
      const lines = [];
      let chunkCount = 0;
      await streamLines(resp.body, { onLine: (l) => lines.push(l), onChunk: () => { chunkCount++; } });
      const linesBefore = lines.length;
      const chunksBefore = chunkCount;
      let abortThrew = false;
      try {
        controller.abort();
      } catch {
        abortThrew = true;
      }
      await new Promise((r) => setTimeout(r, 50));
      return { linesBefore, chunksBefore, linesAfter: lines.length, chunksAfter: chunkCount, abortThrew };
    };

    // ── Scenario 9 (#630 Phase 4, new/additive) — the package's own
    //    `queryProgress()` proves the SAME native post-header cancellation
    //    semantics Scenario 6 already proves for the production compatibility
    //    path, but through the NEW Phase-4 convenience API directly: one
    //    package client, one `queryProgress()` call, the original
    //    `AbortController.signal` passed straight through, abort scheduled
    //    from inside the first `onChunk` callback (proving headers have
    //    already resolved and a real body chunk has already been read), then
    //    a wait comfortably past the fixture's held second write to confirm
    //    the abort truly stopped the loop rather than merely delaying it. ──
    window.__scenario9 = async function (baseUrl, queryId, holdMs) {
      const { client, wrapper } = makeClient(baseUrl);
      const controller = new AbortController();
      const lines = [];
      let chunkCount = 0;
      let aborted = false;
      const progressPromise = client.queryProgress(
        {
          sql: 'SELECT 1',
          defaultFormat: 'JSON',
          params: { query_id: queryId },
          authorization: 'Bearer tok',
          signal: controller.signal,
        },
        {
          onLine: (l) => lines.push(l),
          onChunk: () => {
            chunkCount++;
            if (!aborted) {
              aborted = true;
              controller.abort();
            }
          },
        },
      );
      const rejectedName = await nameOf(progressPromise);
      const linesAtRejection = lines.length;
      const chunksAtRejection = chunkCount;
      const countAtRejection = wrapper.count;
      await new Promise((r) => setTimeout(r, holdMs + 1000)); // comfortably past the fixture's hold
      return {
        rejectedName,
        countAtRejection,
        countAfterWait: wrapper.count,
        linesAtRejection,
        chunksAtRejection,
        linesAfterWait: lines.length,
        chunksAfterWait: chunkCount,
      };
    };

    // ── Scenario 5 auth variant (#630 Phase 6) — native post-header body
    //    lifetime, through `authenticatedRequest()`. Same two-phase shape as
    //    Scenario 5 above: phase 1 settles the authenticated request and
    //    reads the immediate first chunk; phase 2 starts a second, genuinely
    //    pending native reader.read() and THEN aborts the original signal. ──
    window.__scenario5AuthStart = async function (baseUrl, queryId) {
      const { ctx, wrapper } = makeAuthCtx(baseUrl);
      const controller = new AbortController();
      const resp = await authenticatedRequest(ctx, {
        sql: 'SELECT 1',
        defaultFormat: 'JSON',
        params: { query_id: queryId },
        signal: controller.signal,
      });
      const identity = resp === wrapper.lastResponse;
      const bodyUsedBeforeRead = resp.bodyUsed;
      const reader = resp.body.getReader();
      const first = await reader.read();
      const firstText = first.value ? new TextDecoder().decode(first.value) : null;
      window.__scenario5AuthState = { controller, reader, resp };
      return {
        identity, bodyUsedBeforeRead, firstDone: first.done, firstText,
        count: wrapper.count,
        authorization: wrapper.calls[0].authorization,
      };
    };
    window.__scenario5AuthAbortAndReadNext = async function () {
      const { controller, reader, resp } = window.__scenario5AuthState;
      const pending = reader.read();
      controller.abort();
      const rejectedName = await nameOf(pending);
      return { rejectedName, sendResponseStatus: resp.status, sendResponseOk: resp.ok };
    };

    // ── Scenario 6 auth variant (#630 Phase 6) — no later package
    //    streamLines() callbacks after cancellation, through
    //    `authenticatedRequest()` → package `streamLines` — the exact
    //    production path `runQuery()` still uses in Phase 6. ──────────────
    window.__scenario6Auth = async function (baseUrl, queryId, holdMs) {
      const { ctx, onTransportOfflineCalls } = makeAuthCtx(baseUrl);
      const controller = new AbortController();
      const resp = await authenticatedRequest(ctx, {
        sql: 'SELECT 1',
        defaultFormat: 'JSON',
        params: { query_id: queryId },
        signal: controller.signal,
      });
      const lines = [];
      let chunkCount = 0;
      let aborted = false;
      const streamPromise = streamLines(resp.body, {
        onLine: (l) => lines.push(l),
        onChunk: () => {
          chunkCount++;
          if (!aborted) {
            aborted = true;
            controller.abort();
          }
        },
      });
      const rejectedName = await nameOf(streamPromise);
      const linesAtRejection = lines.length;
      const chunksAtRejection = chunkCount;
      await new Promise((r) => setTimeout(r, holdMs + 1000)); // comfortably past the fixture's hold
      return {
        rejectedName,
        linesAtRejection,
        chunksAtRejection,
        linesAfterWait: lines.length,
        chunksAfterWait: chunkCount,
        offlineCallsAfterAbort: onTransportOfflineCalls.length, // abort must never report offline
      };
    };

    // ── Scenario 7 auth variant (#630 Phase 6) — concurrent-request
    //    isolation, sharing ONE authenticated context (ctx) for A and B —
    //    an auth-loop-global cancellation-state bug would only be
    //    observable this way. ─────────────────────────────────────────────
    window.__scenario7Auth = async function (baseUrl, queryIdA, queryIdB, holdMs) {
      const { ctx } = makeAuthCtx(baseUrl);
      const controllerA = new AbortController();
      const controllerB = new AbortController();
      const [respA, respB] = await Promise.all([
        authenticatedRequest(ctx, { sql: 'SELECT 1', defaultFormat: 'JSON', params: { query_id: queryIdA }, signal: controllerA.signal }),
        authenticatedRequest(ctx, { sql: 'SELECT 1', defaultFormat: 'JSON', params: { query_id: queryIdB }, signal: controllerB.signal }),
      ]);
      const readerA = respA.body.getReader();
      const readerB = respB.body.getReader();
      await readerA.read(); // immediate first chunk, both sides
      await readerB.read();
      const pendingA = readerA.read(); // now both genuinely pending on the fixture's hold
      const pendingB = readerB.read();
      controllerA.abort();
      const aRejectedName = await nameOf(pendingA);
      const bResult = await pendingB; // B must NOT be affected by A's abort
      const bFirstHeldText = bResult.value ? new TextDecoder().decode(bResult.value) : null;
      const bNext = await readerB.read();
      return { aRejectedName, bFirstHeldDone: bResult.done, bFirstHeldText, bCompletedCleanly: bNext.done };
    };

    // ── Scenario 8 auth variant (#630 Phase 6) — abort after full
    //    completion has no effect, through authenticatedRequest() + package
    //    streamLines(). ────────────────────────────────────────────────────
    window.__scenario8Auth = async function (baseUrl, queryId) {
      const { ctx } = makeAuthCtx(baseUrl);
      const controller = new AbortController();
      const resp = await authenticatedRequest(ctx, {
        sql: 'SELECT 1',
        defaultFormat: 'JSON',
        params: { query_id: queryId },
        signal: controller.signal,
      });
      const lines = [];
      let chunkCount = 0;
      await streamLines(resp.body, { onLine: (l) => lines.push(l), onChunk: () => { chunkCount++; } });
      const linesBefore = lines.length;
      const chunksBefore = chunkCount;
      let abortThrew = false;
      try {
        controller.abort();
      } catch {
        abortThrew = true;
      }
      await new Promise((r) => setTimeout(r, 50));
      return { linesBefore, chunksBefore, linesAfter: lines.length, chunksAfter: chunkCount, abortThrew };
    };

    // ── Scenario 9 auth variant (#630 Phase 6) — routes through
    //    `authenticatedProgress()` (NOT the raw package
    //    `client.queryProgress()` Scenario 9 above uses), the real Phase-6
    //    composition: SQL Browser auth/epoch policy -> package `request()`
    //    -> package `consumeProgressResponse()` -> native body. Asserts
    //    exactly one Fetch for the successful attempt and no callback after
    //    cancellation. ──────────────────────────────────────────────────────
    window.__scenario9Auth = async function (baseUrl, queryId, holdMs) {
      const { ctx, wrapper } = makeAuthCtx(baseUrl);
      const controller = new AbortController();
      const lines = [];
      let chunkCount = 0;
      let aborted = false;
      const progressPromise = authenticatedProgress(
        ctx,
        {
          sql: 'SELECT 1',
          defaultFormat: 'JSON',
          params: { query_id: queryId },
          signal: controller.signal,
        },
        {
          onLine: (l) => lines.push(l),
          onChunk: () => {
            chunkCount++;
            if (!aborted) {
              aborted = true;
              controller.abort();
            }
          },
        },
      );
      const rejectedName = await nameOf(progressPromise);
      const linesAtRejection = lines.length;
      const chunksAtRejection = chunkCount;
      const countAtRejection = wrapper.count;
      await new Promise((r) => setTimeout(r, holdMs + 1000)); // comfortably past the fixture's hold
      return {
        rejectedName,
        countAtRejection,
        countAfterWait: wrapper.count,
        linesAtRejection,
        chunksAtRejection,
        linesAfterWait: lines.length,
        chunksAfterWait: chunkCount,
        authorization: wrapper.calls[0].authorization,
      };
    };

    // ── Extra — invalid UTF-8 raw bytes stay byte-identical at the native
    //    browser boundary (bullet 6), read via arrayBuffer(), never .text().
    window.__scenarioInvalidUtf8 = async function (baseUrl, queryId) {
      const { transport, wrapper } = makeTransport(baseUrl);
      const resp = await transport.send({
        sql: 'SELECT 1',
        defaultFormat: 'JSON',
        params: { query_id: queryId },
        authorization: 'Bearer tok',
      });
      const identity = resp === wrapper.lastResponse;
      const bodyUsedBeforeConsume = resp.bodyUsed;
      const buf = await resp.arrayBuffer();
      return { identity, bodyUsedBeforeConsume, status: resp.status, bytes: Array.from(new Uint8Array(buf)) };
    };

    window.__ready = true;
  </script>
