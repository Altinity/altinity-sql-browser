<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Dashboard variable tabs (#457)</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body data-theme="dark">
  <!-- `#root` on purpose: styles.css scopes the full-height flex chain to it. -->
  <div id="root"></div>
  <script type="importmap">
    { "imports": {
      "@preact/signals-core": "/node_modules/@preact/signals-core/dist/signals-core.mjs",
      "marked": "/node_modules/marked/lib/marked.esm.js",
      "@codemirror/state": "/node_modules/@codemirror/state/dist/index.js",
      "@codemirror/view": "/node_modules/@codemirror/view/dist/index.js",
      "@codemirror/commands": "/node_modules/@codemirror/commands/dist/index.js",
      "@codemirror/lang-json": "/node_modules/@codemirror/lang-json/dist/index.js",
      "@codemirror/language": "/node_modules/@codemirror/language/dist/index.js",
      "@codemirror/lang-sql": "/node_modules/@codemirror/lang-sql/dist/index.js",
      "@codemirror/lang-xml": "/node_modules/@codemirror/lang-xml/dist/index.js",
      "@codemirror/autocomplete": "/node_modules/@codemirror/autocomplete/dist/index.js",
      "@codemirror/search": "/node_modules/@codemirror/search/dist/index.js",
      "@lezer/common": "/node_modules/@lezer/common/dist/index.js",
      "@lezer/highlight": "/node_modules/@lezer/highlight/dist/index.js",
      "@lezer/lr": "/node_modules/@lezer/lr/dist/index.js",
      "@lezer/json": "/node_modules/@lezer/json/dist/index.js",
      "@lezer/xml": "/node_modules/@lezer/xml/dist/index.js",
      "style-mod": "/node_modules/style-mod/src/style-mod.js",
      "w3c-keyname": "/node_modules/w3c-keyname/index.js",
      "crelt": "/node_modules/crelt/index.js",
      "@marijn/find-cluster-break": "/node_modules/@marijn/find-cluster-break/src/index.js"
    } }
  </script>
  <script type="module">
    // #457/#465: the WHOLE application — the Dashboards tree AND the workbench
    // column, with a real CodeMirror editor injected. `dashboard-tree.html`
    // deliberately omits the workbench, so it can only prove the tab MODEL;
    // this fixture is where "the main CodeMirror editor, toolbar, tab strip and
    // Run action are REUSED for a variable" is actually observable — the tab
    // strip, editor, Save and Run are all the shipped controls.
    import { createApp } from '/src/ui/app.js';
    import { createCodeMirrorEditor } from '/src/editor/codemirror-adapter.js';
    import { createSpecEditor } from '/src/editor/spec-editor.js';
    import { createCodeViewer } from '/src/editor/code-viewer.js';

    const query = (id, name, sql) => ({
      id, sql, specVersion: 1, spec: { name, panel: { cfg: { type: 'bar', x: 0, y: [1] } } },
    });
    const dash = (id, title, over = {}) => ({
      documentVersion: 2, id, title, revision: 1,
      layout: { type: 'flow', version: 1, preset: 'report', items: { ['t-' + id]: {} } },
      // Each Dashboard owns its OWN copy of the panel query (#427) — sharing one
      // query id across two Dashboards is rejected by the aggregate.
      tiles: [{ id: 't-' + id, queryId: 'q-' + id }], ...over,
    });
    // Both Dashboards declare a variable called `zone`. That is the point: the
    // same NAME in two Dashboards must be two independent documents.
    const seed = {
      storageVersion: 5, id: 'workspace', key: 'workspace', name: 'Workspace',
      queries: [
        query('q-sales', 'Sales', 'SELECT 1 AS v WHERE z = {zone:String}'),
        query('q-ops', 'Ops', 'SELECT 2 AS v WHERE z = {zone:String}'),
        // The issue's own example name — long enough to prove the tab strip
        // ellipsizes rather than widening, which happy-dom cannot observe.
        query('q-long', 'Long', 'SELECT 3 AS v WHERE q = {is_initial_query:String}'),
      ],
      dashboards: [
        dash('sales', 'Sales', { variableConfigs: { zone: { sql: "SELECT 'eu', 'Europe'" } } }),
        dash('ops', 'Ops'),
        dash('long', 'Long'),
      ],
    };

    // #465: Run needs `getToken()`/`ensureConfig()` to resolve, and both are
    // captured from `conn` once at createApp() time — stubbing them after the
    // fact (the way `ensureFreshToken`/`loadSchema` are stubbed below) would
    // not reach the already-wired workbench session. Basic-auth mode short-
    // circuits BOTH with no network call at all, and is read from
    // sessionStorage before `createConnectionSession` runs, so it has to be
    // seeded here, before `createApp`.
    sessionStorage.setItem('ch_basic_auth', 'e2e-token');
    sessionStorage.setItem('ch_basic_user', 'e2e');

    const root = document.querySelector('#root');
    const app = createApp({
      root,
      broadcastChannel: () => null,
      Editor: createCodeMirrorEditor,
      SpecEditor: (a) => createSpecEditor(a),
      CodeViewer: createCodeViewer,
    });
    app.conn.ensureFreshToken = async () => true;
    app.conn.chCtx.onSignedOut = () => {};
    app.catalog.loadSchema = async () => { app.state.schema.value = []; };
    app.catalog.loadReference = async () => {};
    // #465: a canned two-column response for one probe SQL, a broken
    // one-column response for every other — enough to exercise Run's real
    // wiring (the bounded-probe substitution, the shape validation) without a
    // server. Keyed on the embedded user SQL, since every probe request shares
    // the same `SELECT * FROM ( … ) LIMIT …` wrapper.
    app.exec.executeRead = async (result, req) => {
      if (req.sql.includes("'v1'")) {
        result.columns = [{ name: 'value', type: 'String' }, { name: 'label', type: 'String' }];
        result.rows = [['v1', 'Label 1']];
      } else {
        result.columns = [{ name: 'only', type: 'String' }];
        result.rows = [[1]];
      }
      result.error = null;
      return result;
    };

    const loaded = await app.workspace.loadById(seed.id);
    let workspace = loaded.status === 'ok' ? loaded.workspace : null;
    // Reseeded on EVERY load, unlike dashboard-tree.html's sessionStorage guard:
    // these specs commit real configuration changes, so a later test must never
    // inherit an earlier one's writes.
    await app.workspace.delete(seed.id);
    const committed = await app.workspace.create(seed);
    if (!committed.ok) throw new Error(committed.diagnostics[0]?.message || 'seed failed');
    workspace = committed.workspace;

    app.applyCommittedWorkspace(workspace);
    app.renderApp();
    app.applyCommittedWorkspace(workspace);

    /** Every open variable tab, as the model sees it. */
    window.__variableTabs = () => app.state.tabs.value
      .filter((tab) => tab.doc?.kind === 'dashboard-variable')
      .map((tab) => ({ name: tab.name, sql: tab.sqlDraft, dirty: tab.dirtySql, ...tab.doc }));
    /** The committed option SQL for one variable — committed truth, not the tab. */
    window.__storedSql = async (dashboardId, name) => {
      const read = await app.workspace.loadById(seed.id);
      if (read.status !== 'ok') return null;
      const found = read.workspace.dashboards.find((d) => d.id === dashboardId);
      return found?.variableConfigs?.[name]?.sql ?? null;
    };
    /** The active tab's run result, narrowed to what the Run specs check. */
    window.__runResult = () => {
      const r = app.activeTab().result;
      return r ? { error: r.error, rows: r.rows, columns: r.columns } : null;
    };
    window.__app = app;
    window.__ready = true;
  </script>
</body>
</html>
