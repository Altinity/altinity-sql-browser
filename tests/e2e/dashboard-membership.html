<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Dashboard membership workflow</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body data-theme="dark">
  <main id="surface"></main>
  <script type="importmap">
    { "imports": {
      "@altinity/clickhouse-http": "/packages/clickhouse-http/src/index.js",
      "@preact/signals-core": "/node_modules/@preact/signals-core/dist/signals-core.mjs",
      "marked": "/node_modules/marked/lib/marked.esm.js",
      "@codemirror/state": "/node_modules/@codemirror/state/dist/index.js",
      "@codemirror/view": "/node_modules/@codemirror/view/dist/index.js",
      "@codemirror/commands": "/node_modules/@codemirror/commands/dist/index.js",
      "@codemirror/lang-json": "/node_modules/@codemirror/lang-json/dist/index.js",
      "@codemirror/language": "/node_modules/@codemirror/language/dist/index.js",
      "@codemirror/lang-sql": "/node_modules/@codemirror/lang-sql/dist/index.js",
      "@codemirror/lang-xml": "/node_modules/@codemirror/lang-xml/dist/index.js",
      "@codemirror/autocomplete": "/node_modules/@codemirror/autocomplete/dist/index.js",
      "@codemirror/search": "/node_modules/@codemirror/search/dist/index.js",
      "@lezer/common": "/node_modules/@lezer/common/dist/index.js",
      "@lezer/highlight": "/node_modules/@lezer/highlight/dist/index.js",
      "@lezer/lr": "/node_modules/@lezer/lr/dist/index.js",
      "@lezer/json": "/node_modules/@lezer/json/dist/index.js",
      "@lezer/xml": "/node_modules/@lezer/xml/dist/index.js",
      "style-mod": "/node_modules/style-mod/src/style-mod.js",
      "w3c-keyname": "/node_modules/w3c-keyname/index.js",
      "crelt": "/node_modules/crelt/index.js",
      "@marijn/find-cluster-break": "/node_modules/@marijn/find-cluster-break/src/index.js"
    } }
  </script>
  <script type="module">
    import { createApp } from '/src/ui/app.js';
    import { libraryPanelDef, historyPanelDef } from '/src/ui/saved-history.js';
    import { buildSidePanelRegistry, renderSidePanelTabs } from '/src/ui/side-panel-registry.js';
    import { lowerIdForKey, sidePanelKeyFor } from '/src/core/side-panels.js';
    import { renderDashboard } from '/src/ui/dashboard.js';
    import { createAuthenticatedExecutionScope } from '/src/application/authenticated-execution-scope.js';

    // #427: a Library query plus a Dashboard whose tile owns its OWN dedicated
    // copy. The star no longer creates membership, so a tile has to be seeded to
    // exercise removal — and the owned copy must stay out of the Library list.
    const seed = {
      storageVersion: 5, id: 'workspace', key: 'workspace', name: 'Workspace',
      queries: [
        { id: 'q1', sql: 'SELECT 1', specVersion: 1, spec: { name: 'Revenue', favorite: false } },
        { id: 'q1-owned', sql: 'SELECT 1', specVersion: 1, spec: { name: 'Revenue', dashboard: { role: 'panel' } } },
      ],
      dashboards: [{
        documentVersion: 2, id: 'dashboard', title: 'Membership', revision: 1,
        // #537: flow/report ON PURPOSE. The per-tile remove affordance this spec
        // drives used to be a grid-only control, so this fixture had to be a grid to
        // reach it at all; it is a `⋯` menu row now, available under every style, and
        // driving it from the style that previously had NO delete is what proves that.
        layout: {
          type: 'flow', version: 1, preset: 'report', items: { t1: { span: 1, height: 'medium' } },
        },
        tiles: [{ id: 't1', queryId: 'q1-owned' }],
      }],
    };
    const root = document.querySelector('#surface');
    const app = createApp({ root, broadcastChannel: () => null });
    // #524: this fixture calls `renderDashboard()` without the production login
    // bootstrap, so it owns a minimal open authenticated epoch for its stubbed
    // reads instead of allowing the new auth gate to render Login.
    const scope = createAuthenticatedExecutionScope({ epoch: 1, cancelRemote: () => {} });
    app.executionScope = () => scope;
    app.requireAuthenticatedExecution = () => scope;
    app.conn.ensureFreshToken = async () => true;
    app.conn.chCtx.onSignedOut = () => {};
    app.exec.executeRead = async (result) => {
      result.columns = [{ name: 'value', type: 'UInt8' }];
      result.rows = [[1]];
      result.progress = { rows: 1, bytes: 1 };
      result.error = null;
      return result;
    };

    // #425: the application shell owns the surface hosts and the header slot and
    // hands the Dashboard a render target. This harness plays that role with two
    // plain divs, so the fixture keeps exercising the real `renderDashboard`.
    const headerSlot = document.createElement('div');
    const dashboardHost = document.createElement('div');
    const dashboardTarget = () => ({
      host: dashboardHost,
      dashboardId: (app.currentWorkspace?.dashboards[0] ?? null)?.id ?? null,
      mode: 'edit',
      focus: null,
      setHeader: (header) => headerSlot.replaceChildren(header),
    });

    // #587: this harness used to hand `renderSavedHistory` three ad-hoc divs
    // via `app.dom.savedTabsRow`/`savedSearch`/`savedList` — fields `AppDom`
    // no longer has. A `mount(host)` registry owns which host a panel paints
    // into and cannot honour externally-supplied hosts, so this builds the
    // SAME registry `app-shell.ts` does (just for the two lower panels) and
    // hands it hosts of its own choosing, exactly like the real shell.
    function renderWorkbench() {
      const registry = buildSidePanelRegistry([libraryPanelDef(app), historyPanelDef(app)]);
      const tabsRow = document.createElement('div');
      tabsRow.className = 'side-tabs';
      const selectLowerPanel = (id) => { app.state.sidePanel.value = sidePanelKeyFor(id); };
      const refreshLowerPane = () => {
        const activeId = lowerIdForKey(app.state.sidePanel.value);
        renderSidePanelTabs(tabsRow, registry.entries, activeId, selectLowerPanel);
        registry.showPanel(activeId);
      };
      app.shell = { sidePanels: { ...registry, refreshActiveSidePanels: refreshLowerPane } };
      refreshLowerPane();
      const open = document.createElement('button');
      open.textContent = 'Open Dashboard';
      open.onclick = () => { void renderDashboard(app, dashboardTarget()); };
      root.replaceChildren(tabsRow, ...registry.entries.map((entry) => entry.host), open, headerSlot, dashboardHost);
    }

    const loaded = await app.workspace.loadById(seed.id);
    let workspace = loaded.status === 'ok' ? loaded.workspace : null;
    if (!sessionStorage.getItem('membership-seeded')) {
      await app.workspace.delete(seed.id);
      const committed = await app.workspace.create(seed);
      if (!committed.ok) throw new Error(committed.diagnostics[0]?.message || 'seed failed');
      workspace = committed.workspace;
      sessionStorage.setItem('membership-seeded', '1');
    }
    if (!workspace) throw new Error('seeded workspace missing');
    app.applyCommittedWorkspace(workspace);
    renderWorkbench();
    window.__workspace = async () => {
      const current = await app.workspace.loadById(seed.id);
      return current.status === 'ok' ? current.workspace : null;
    };
    window.__ready = true;
  </script>
</body>
</html>
